<style>

*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;font-size:14px;line-height:1.5}
button{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){border-color:var(--acc);background:#1d2a47}button:disabled{opacity:.45;cursor:not-allowed}
button.pri{background:linear-gradient(180deg,#f5c25e,#d99a2b);color:#1a1205;border-color:#f2b84b;font-weight:700}button.pri:hover{filter:brightness(1.08)}
button.big{padding:11px 22px;font-size:16px}
select,input{font:inherit;background:var(--p2);color:var(--t);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.hide{display:none!important}.mut{color:var(--mut);font-weight:400;font-size:12px}.up{color:var(--good)}.dn{color:var(--bad)}.hl{color:var(--acc)}
#top{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:8px 14px;background:linear-gradient(90deg,#0e1830,#141f3a);border-bottom:1px solid var(--line)}
#top .brand{font-weight:900;color:var(--acc);letter-spacing:1px}#top .who{display:flex;align-items:center;gap:6px}#top .elec b{color:var(--acc)}#top .tbtn{margin-left:auto;display:flex;gap:6px}#top .tbtn button{padding:4px 10px}
#stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px;padding:8px 14px}
.tile{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:6px 10px;position:relative;overflow:hidden}.tile span{font-size:11px;color:var(--mut)}.tile>b{display:block;font-size:18px}
.tile .sub{font-size:11px;color:var(--mut)}.tile .sub.up{color:var(--good)}.tile .sub.dn{color:var(--bad)}.spark{position:absolute;right:6px;top:8px;width:60px;height:18px;opacity:.8}
.bar{height:5px;background:#0a1222;border-radius:3px;overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;border-radius:3px;transition:width .5s}

.col{display:flex;flex-direction:column;gap:10px;min-width:0}

#map .land{fill:#1b2540;stroke:#0a1426;stroke-width:.5}#map .cty{stroke:#0a1426;stroke-width:.6;transition:fill .4s}#map .cty:hover{filter:brightness(1.25)}#map .cty.sel{stroke:#fff;stroke-width:1.8}
#map .cty.war{animation:warp 1.2s infinite alternate}@keyframes warp{to{filter:brightness(1.4)}}
#map .lbl circle{fill:#d7deec;stroke:#0a1426;stroke-width:1.5}#map .lbl text{font-size:11px;fill:#e7edf8;paint-order:stroke;stroke:#0a1426;stroke-width:3px;font-weight:700}
#map .lbl.me circle{fill:var(--acc);r:6}#map .lbl.me text{fill:var(--acc);font-size:13px}#map .lbl.sel circle{fill:#fff;r:6.5;stroke:#5aa9ff;stroke-width:2.5}#map .lbl.ally circle{fill:#5aa9ff}
.wline{stroke:#ff3b4e;stroke-width:2.5;stroke-dasharray:7 5;animation:dash 1s linear infinite}.aline{stroke:#5aa9ff;stroke-width:1.4;opacity:.55;stroke-dasharray:3 3}@keyframes dash{to{stroke-dashoffset:-24}}
.legend{display:flex;gap:10px;font-size:11px;color:var(--mut);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:3px;vertical-align:-1px}
#stage{aspect-ratio:640/300;width:100%;border-radius:10px;overflow:hidden;background:#000;border:1px solid var(--line)}#stage svg{width:100%;height:100%;display:block}
#stageCap{position:absolute;left:10px;bottom:8px;background:rgba(5,10,20,.7);padding:2px 10px;border-radius:20px;font-size:12px;color:var(--acc)}#stageWrap{position:relative}
#result{min-height:22px;margin-top:8px;font-size:13px}#result b{color:var(--acc)}#result.pop{animation:pop .4s}@keyframes pop{from{transform:translateY(6px);opacity:0}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.slot{background:var(--p2);border:1px dashed var(--line);border-radius:8px;padding:6px;font-size:12px;min-height:52px}.slot span{display:block;color:var(--mut);font-size:11px}
.slot.done{border-style:solid;border-color:#2c4a3a;background:#132a22}.slot.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.brief{margin:8px 0;background:#0e1628;border-radius:8px;padding:6px 10px;font-size:12px}.brief summary{cursor:pointer;font-weight:700}.brief div{padding:2px 0;border-bottom:1px solid #18233a}
.tabs{display:flex;gap:4px;margin:10px 0 6px;flex-wrap:wrap}.tabs button{flex:1;padding:6px 4px;font-size:13px}.tabs button.on{background:var(--acc);color:#1a1205;border-color:var(--acc);font-weight:700}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:330px;overflow:auto;padding-right:2px}
.act{text-align:left;display:flex;flex-direction:column;gap:1px;padding:7px 9px}.act b{font-size:13px}.act small{font-size:11px;color:var(--mut);line-height:1.35}.act em{font-style:normal;font-size:11px;color:#b98cff}
.endday{width:100%;margin-top:8px;padding:10px;font-weight:700;background:linear-gradient(180deg,#2b3d66,#1d2a47)}
.tgt{display:flex;gap:10px}.tpt{width:92px;flex:none}.tpt svg,.cm svg{width:100%;border-radius:8px;display:block}.tinfo{flex:1;min-width:0}.tn{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.tn small{color:var(--mut)}
.relrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12px}.rbar,.fbar{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,#d9485f,#3a4766,#2fb37a);position:relative}.rbar i,.fbar i{position:absolute;top:-4px;width:6px;height:16px;border-radius:3px;margin-left:-3px;background:#fff!important;box-shadow:0 0 0 2px #0a1120}
.tags{display:flex;gap:4px;flex-wrap:wrap}.tg{font-style:normal;font-size:11px;padding:1px 7px;border-radius:10px;background:#22304d}.tg.ally{background:#1d3a66}.tg.trade{background:#1d4a3a}.tg.bad{background:#5a1f2b}.tg.war{background:#a3172a}.tg.warn{background:#5a4214}
.front{margin-top:6px;font-size:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}.front .fbar{background:linear-gradient(90deg,#d9485f,#3a4766,#2fb37a);min-width:120px}
.cab{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cm{padding:4px;display:flex;flex-direction:column;align-items:center;text-align:center}.cm b{font-size:12px;margin-top:3px}.cm small{font-size:10px;color:var(--mut)}
.nlist{max-height:260px;overflow:auto;font-size:12px}.n{padding:4px 2px;border-bottom:1px solid #18233a}.n span{color:var(--mut);font-size:10px;margin-right:6px}.n.war{color:#ff9aa5}.n.me{color:#c9d6ee}
#ticker{position:fixed;left:0;right:0;bottom:0;height:30px;background:#7a1d2b;display:flex;align-items:center;z-index:5;font-size:13px;overflow:hidden}#ticker b{background:#b3243a;height:100%;display:flex;align-items:center;padding:0 12px;flex:none;z-index:1}
#ticker div{flex:1;overflow:hidden;white-space:nowrap}#ticker span{display:inline-block;padding-left:100%;animation:tick 60s linear infinite}@keyframes tick{to{transform:translateX(-100%)}}
#modal{position:fixed;inset:0;background:rgba(3,7,15,.78);display:none;align-items:center;justify-content:center;z-index:20;padding:12px;backdrop-filter:blur(3px)}#modal.show{display:flex}
.mbox{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:18px;max-width:720px;width:100%;max-height:94vh;overflow:auto;box-shadow:0 20px 60px #000a;animation:mup .3s}@keyframes mup{from{transform:translateY(16px) scale(.98);opacity:0}}
#modal.full .mbox{max-width:980px}#modal.evm .mbox{padding:0;overflow:hidden auto}
h2{margin:0 0 12px}h3{margin:0 0 6px;color:var(--acc)}
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.row.r{justify-content:flex-end}.row.c{justify-content:center}.col button{width:100%;margin-bottom:6px;text-align:left}
.start{text-align:center;padding:10px}.logo{font-size:44px;font-weight:900;color:var(--acc);letter-spacing:2px}.logo small{display:block;font-size:16px;color:var(--mut);letter-spacing:6px}.lead{max-width:520px;margin:10px auto;color:#c9d6ee}
.best{margin:16px auto;max-width:420px;text-align:left;background:var(--p2);padding:10px 14px;border-radius:10px;font-size:13px}.fine{font-size:11px;color:var(--mut);margin-top:14px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}.ccard{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px}.ccard b{font-size:15px}.ccard span{font-size:11px;color:var(--mut)}.ccard em{font-style:normal;font-size:11px;color:#c9d6ee;margin-top:3px}.ccard.on{border-color:var(--acc);background:#2a2614;box-shadow:0 0 0 1px var(--acc) inset}
.avatar{display:flex;gap:18px;flex-wrap:wrap}.apv{width:220px;flex:none;margin:0 auto}.apv svg{width:100%;border-radius:12px;display:block}.aopts{flex:1;min-width:260px}
.opt{display:flex;align-items:center;gap:8px;margin-bottom:7px}.opt label{width:44px;flex:none;font-size:12px;color:var(--mut)}.opt>div{display:flex;gap:4px;flex-wrap:wrap}.opt input{flex:1}
.sw{padding:3px 8px;font-size:12px;min-width:30px}.sw i{display:block;width:18px;height:18px;border-radius:50%;border:1px solid #0006}.sw.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.evscene{aspect-ratio:640/240;overflow:hidden}.evscene svg{width:100%;height:100%;display:block}
.evbody{display:flex;gap:14px;padding:14px 18px 18px}.spk{width:110px;flex:none;text-align:center}.spk svg{width:100%;border-radius:10px;display:block;margin-bottom:4px}.spk b{display:block;font-size:13px}.spk small{font-size:11px;color:var(--mut)}
.evbody>div:last-child{flex:1;min-width:0}.evtxt{min-height:48px;font-size:15px;cursor:pointer}.chs{display:flex;flex-direction:column;gap:6px}.ch{text-align:left;display:flex;flex-direction:column}.ch small{font-size:11px;color:var(--mut)}.react{margin:4px 0 8px;font-size:14px;color:#c9d6ee}
.adv{display:flex;gap:16px;align-items:flex-start}.adv .spk{width:140px}.adv>div:last-child{flex:1}
.over{text-align:center}.over .evscene{border-radius:12px;margin-bottom:12px;aspect-ratio:640/220}.grade{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}.grade b{font-size:52px;color:var(--acc);font-weight:900}
.ogrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.ogrid div{background:var(--p2);border-radius:8px;padding:8px;font-size:12px;color:var(--mut)}.ogrid b{display:block;font-size:18px;color:var(--t)}
.chart{margin-bottom:10px}.chart svg{width:100%;font-size:11px;fill:var(--mut)}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}.achi{background:var(--p2);border-radius:10px;padding:8px;opacity:.4;filter:grayscale(1)}.achi.on{opacity:1;filter:none;border:1px solid var(--acc)}.achi span{font-size:24px}.achi b{display:block}.achi small{font-size:11px;color:var(--mut)}
.help p{margin:6px 0}
#toasts{position:fixed;top:60px;right:12px;z-index:30;display:flex;flex-direction:column;gap:6px;pointer-events:none}.toast{background:#1d2a47;border:1px solid var(--line);padding:8px 14px;border-radius:10px;box-shadow:0 8px 24px #0008;animation:tin .3s;max-width:300px}.toast.bad{border-color:var(--bad)}.toast.ach{border-color:var(--acc);background:#2a2614}.toast.out{opacity:0;transform:translateX(20px);transition:.5s}@keyframes tin{from{transform:translateX(30px);opacity:0}}
#dayov{position:fixed;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;background:radial-gradient(circle,#0a1120cc,#0a1120f2);transition:opacity .4s}#dayov.show{opacity:1}#dayov div{text-align:center}#dayov b{display:block;font-size:42px;font-weight:900;color:var(--acc)}#dayov small{font-size:16px;color:#c9d6ee}
.pt{display:block}
/* ===== 角色動畫 ===== */
.lid{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0);animation:blink var(--bd,4.6s) var(--bdl,0s) infinite}.lidc{transform-box:fill-box;transform-origin:50% 0}
@keyframes blink{0%,93%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.mo{transform-box:fill-box;transform-origin:50% 25%;transform:scaleY(.06)}.talking .mo{animation:talk .2s ease-in-out infinite alternate}.talk2 .mo{animation-duration:.26s;animation-delay:-.1s}
@keyframes talk{from{transform:scaleY(.06)}to{transform:scaleY(1)}}
.breathe,.talking{animation:breathe 3.6s ease-in-out infinite}@keyframes breathe{50%{transform:translateY(1.6px)}}
.person .legL{transform-origin:-7px -62px}.person .legR{transform-origin:7px -62px}.person .armL{transform-origin:-31px -118px}.person .armR{transform-origin:31px -118px}
.walk .legL,.walk .armR{animation:legs .5s ease-in-out infinite alternate}.walk .legR,.walk .armL{animation:legs .5s ease-in-out infinite alternate-reverse}@keyframes legs{from{transform:rotate(16deg)}to{transform:rotate(-16deg)}}
.person.wave .armR{animation:wave .55s ease-in-out infinite alternate}@keyframes wave{from{transform:rotate(-155deg)}to{transform:rotate(-115deg)}}
.shakeL .armR{animation:shk .3s ease-in-out infinite alternate}@keyframes shk{from{transform:rotate(-46deg)}to{transform:rotate(-56deg)}}
.shakeR .armL{animation:shk2 .3s ease-in-out infinite alternate}@keyframes shk2{from{transform:rotate(46deg)}to{transform:rotate(56deg)}}
.person.bob{animation:bob .5s ease-in-out infinite alternate}
.walkin{animation:walkin 3.2s ease-out forwards}@keyframes walkin{from{transform:translateX(-60px)}to{transform:translateX(320px)}}
.bob{animation:bob .5s ease-in-out infinite alternate}@keyframes bob{to{transform:translateY(-4px)}}
/* ===== 場景動畫 ===== */
.flagw{transform-box:fill-box;transform-origin:0 50%;animation:flagw 1.6s ease-in-out infinite alternate}@keyframes flagw{from{transform:skewY(2deg)}to{transform:skewY(-3deg) scaleX(.95)}}
.cloud{animation:cloud 24s linear infinite alternate}@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
.twk{animation:glow 1.5s ease-in-out infinite alternate}
.flash{opacity:0;animation:flash 2.6s infinite}@keyframes flash{0%,88%,100%{opacity:0}91%{opacity:.95}}
.ph1{animation:ph1 3.8s forwards}@keyframes ph1{0%,42%{opacity:1}52%,100%{opacity:0}}.ph2{opacity:0;animation:ph2 3.8s forwards}@keyframes ph2{0%,44%{opacity:0}56%,100%{opacity:1}}
.flyby{animation:flyby 1.9s ease-in-out forwards}@keyframes flyby{from{transform:translateX(-150px)}to{transform:translateX(820px)}}
.tanks{animation:tanks 7s linear infinite}@keyframes tanks{from{transform:translateX(-260px)}to{transform:translateX(300px)}}.jets{animation:jets 3.2s linear infinite}@keyframes jets{from{transform:translateX(-260px)}to{transform:translateX(860px)}}
.wheel{transform-box:fill-box;transform-origin:center;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.smoke{transform-box:fill-box;transform-origin:center;animation:smoke 3s ease-in-out infinite alternate}@keyframes smoke{to{transform:scale(1.4) translateY(-10px);opacity:.6}}
.rise{transform-box:fill-box;transform-origin:50% 100%;animation:rise 3s ease-out forwards}@keyframes rise{from{transform:scaleY(.08)}}
.crane{animation:crane 3s ease-in-out infinite alternate}@keyframes crane{to{transform:translateX(-30px)}}
.trace{stroke-dasharray:420;stroke-dashoffset:420;animation:draw 2s forwards}.draw{stroke-dasharray:1300;stroke-dashoffset:1300;animation:draw 2.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.glow{animation:glow 1s ease-in-out infinite alternate}@keyframes glow{from{opacity:.35}to{opacity:1}}
.beam{transform-box:fill-box;transform-origin:50% 100%;animation:beam 3s ease-in-out infinite alternate}@keyframes beam{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.fall{transform-box:fill-box;transform-origin:center;animation:fall 3s linear infinite}@keyframes fall{to{transform:translateY(330px) rotate(540deg)}}
.fw{opacity:0;animation:fw 1.8s ease-out infinite}@keyframes fw{0%{opacity:0;transform:scale(.1)}15%{opacity:1}100%{opacity:0;transform:scale(1.4)}}
.zzz{opacity:0;animation:zzz 2.4s ease-in infinite}@keyframes zzz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(30px,-60px)}}
.stamp{transform-box:fill-box;transform-origin:center;animation:stamp .5s .9s cubic-bezier(.3,1.6,.5,1) both}@keyframes stamp{from{transform:scale(3) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.land{animation:land 1.6s ease-out forwards}@keyframes land{from{transform:translate(-320px,-100px)}to{transform:translate(0,0)}}
.crate{opacity:0;animation:crate .5s forwards}@keyframes crate{from{opacity:0;transform:translateY(-20px)}to{opacity:1}}
.growbar{transform-box:fill-box;transform-origin:0 50%;animation:grow 2.4s ease-out both}@keyframes grow{from{transform:scaleX(0)}}
.quake{animation:quake .1s linear 24}@keyframes quake{0%{transform:translate(3px,0)}50%{transform:translate(-3px,2px)}100%{transform:translate(1px,-2px)}}
.rain{animation:rain .5s linear infinite}@keyframes rain{to{transform:translate(-30px,80px)}}.siren{animation:glow .3s infinite alternate}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 1.2s infinite}@keyframes ring{from{transform:scale(1);opacity:.9}to{transform:scale(1.9);opacity:0}}
.pen{animation:pen .4s ease-in-out infinite alternate}@keyframes pen{to{transform:translateX(10px)}}
@media (max-width:900px){#grid{grid-template-columns:1fr;padding:0 8px 50px}#stats{padding:8px}#top{padding:8px}#top .tbtn{margin-left:0}
 .col{display:contents}#pStage{order:1}#pSched{order:2}#pMap{order:3}#pTarget{order:4}#pCab{order:5}#pNews{order:6}.cab{grid-template-columns:repeat(5,1fr)}.evbody{flex-direction:column}.spk{width:90px;display:flex;gap:8px;align-items:center;width:auto;text-align:left}.spk svg{width:70px}.ogrid{grid-template-columns:repeat(2,1fr)}.acts{max-height:none}}
@media (prefers-reduced-motion:reduce){#ticker span{animation-duration:200s}}
</style>
</head>

 if(t==='h'){const cs=[a,b,d].filter(Boolean);cs.forEach((col,i)=>s+=`<rect x="0" y="${i*h/cs.length}" width="${w}" height="${h/cs.length+.5}" fill="${col}"/>`);}

 else if(t==='v'){[a,b,d].forEach((col,i)=>s+=`<rect x="${i*w/3}" y="0" width="${w/3+.5}" height="${h}" fill="${col}"/>`);}
 else if(t==='disc'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><circle cx="${w/2}" cy="${h/2}" r="${h*.3}" fill="${b}"/>`;}
 else if(t==='disc2'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><path d="M${w/2-h*.25},${h/2} a${h*.25},${h*.25} 0 0,1 ${h*.5},0Z" fill="${b}"/><path d="M${w/2-h*.25},${h/2} a${h*.25},${h*.25} 0 0,0 ${h*.5},0Z" fill="${d}"/>`;}
 else if(t==='star'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><text x="${w*.3}" y="${h*.62}" font-size="${h*.5}" text-anchor="middle" fill="${b}">★</text>`;}
 else if(t==='canton'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><rect width="${w/2}" height="${h/2}" fill="${b}"/><circle cx="${w/4}" cy="${h/4}" r="${h*.11}" fill="${d}"/>`;}
 else if(t==='usa'){for(let i=0;i<7;i++)s+=`<rect y="${i*h/6.5}" width="${w}" height="${h/13}" fill="${a}"/>`;s=`<rect width="${w}" height="${h}" fill="#fff"/>`+s+`<rect width="${w*.42}" height="${h*.54}" fill="${b}"/>`;}
 else if(t==='cross'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><path d="M0,0 L${w},${h} M${w},0 L0,${h}" stroke="${d}" stroke-width="${h*.18}"/><path d="M0,0 L${w},${h} M${w},0 L0,${h}" stroke="${b}" stroke-width="${h*.07}"/><rect x="${w*.42}" width="${w*.16}" height="${h}" fill="${d}"/><rect y="${h*.38}" width="${w}" height="${h*.24}" fill="${d}"/><rect x="${w*.45}" width="${w*.1}" height="${h}" fill="${b}"/><rect y="${h*.42}" width="${w}" height="${h*.16}" fill="${b}"/>`;}
 else if(t==='diamond'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><path d="M${w*.08},${h/2} L${w/2},${h*.1} L${w*.92},${h/2} L${w/2},${h*.9}Z" fill="${b}"/><circle cx="${w/2}" cy="${h/2}" r="${h*.22}" fill="${d}"/>`;}
 else if(t==='tri'){s+=`<rect width="${w}" height="${h/2}" fill="${a}"/><rect y="${h/2}" width="${w}" height="${h/2}" fill="${b}"/><path d="M0,0 L${w*.45},${h/2} L0,${h}Z" fill="${d}"/>`;}
 else if(t==='solid'){s+=`<rect width="${w}" height="${h}" fill="${a}"/><rect x="${w*.2}" y="${h*.62}" width="${w*.6}" height="${h*.06}" fill="${b}"/>`;}

// ================= 核心引擎 =================
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const key=(a,b)=>a<b?a+'|'+b:b+'|'+a;
const randn=()=>(Math.random()+Math.random()+Math.random()-1.5)*2;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null;
const C=id=>S.c[id];
const me=()=>S.c[S.me];
const isDem=c=>c.gov==='dem'||c.gov==='parl';
const rel=(a,b)=>S.rel[key(a,b)]??0;
function addRel(a,b,v){if(a===b)return;const k=key(a,b);S.rel[k]=clamp((S.rel[k]??0)+v,-100,100);}
const allied=(a,b)=>S.allies.includes(key(a,b));
const trading=(a,b)=>S.trade.includes(key(a,b));
const sanctioning=(a,b)=>S.sanc.includes(a+'>'+b);
const inWar=a=>S.wars.some(w=>w.A.includes(a)||w.D.includes(a));
const atWar=(a,b)=>S.wars.find(w=>(w.A.includes(a)&&w.D.includes(b))||(w.A.includes(b)&&w.D.includes(a)));
const myWars=()=>S.wars.filter(w=>w.A.includes(S.me)||w.D.includes(S.me));
const myAllies=()=>IDS.filter(i=>i!==S.me&&allied(S.me,i));
const money=p=>me().gdp*p/100;
const others=()=>IDS.filter(i=>i!==S.me);
const rivals=n=>others().sort((a,b)=>rel(S.me,a)-rel(S.me,b)).slice(0,n);
const friends=n=>others().sort((a,b)=>rel(S.me,b)-rel(S.me,a)).slice(0,n);
function fmtB(v){const a=Math.abs(v),sg=v<0?'−':'';if(a>=1000)return sg+(a/1000).toFixed(2)+' 兆美元';if(a>=0.1)return sg+(a*10).toFixed(a*10<100?1:0)+' 億美元';return sg+(a*10000).toFixed(0)+' 萬美元';}
function news(type,txt){S.news.unshift({d:S.day,type,txt});if(S.news.length>120)S.news.length=120;}
function sanctionPen(id){let p=0;S.sanc.forEach(s=>{const [a,b]=s.split('>');if(b===id)p+=0.4*Math.min(1,C(a).gdp/C(id).gdp)*0.5+0.05;if(a===id)p+=0.05;});return p;}
function tradeBon(id){return Math.min(S.trade.filter(k=>k.split('|').includes(id)).length*0.12,0.8);}
function gName(lk){return pick(SURN)+pick(GIVEN.filter((_,i)=>(i%2===0)===(lk.g==='m')));}
function nm(a){return typeof a.n==='function'?a.n():a.n;}

 S={v:2,me:id,name:name||'無名氏',look,diff,day:1,start:Date.UTC(2027,0,1),c:{},rel:{},base:{},allies:[],trade:[],sanc:[],wars:[],wid:0,gen:{},

 for(const k in S.base){S.base[k]=clamp(S.base[k]+ri(-6,6),-100,100);S.rel[k]=S.base[k];}
 ALLY0.forEach(([a,b])=>S.allies.push(key(a,b)));TRADE0.forEach(([a,b])=>S.trade.push(key(a,b)));S.sanc=[...SANC0];
 IDS.forEach(i=>{const c=C(i);c.baseGrowth=c.growth+sanctionPen(i)-tradeBon(i);});

 news('pol',`${S.name}宣誓就任${m.name}${m.title}，展開執政生涯。`);

}

function avail(a){if(S.slots.length>=3)return '今天行程已滿';if(a.cat==='選戰'&&!isDem(me()))return '非民主體制';if(a.cat==='權力'&&isDem(me()))return '民主體制不適用';
 if(a.tgt&&(!S.sel||S.sel===S.me))return '請先在地圖上選擇目標國家';if(a.cost&&S.treasury-money(a.cost)<-me().gdp*0.15)return '國庫赤字過高';
 return a.cond?a.cond():'';}

function apply(o){const out=[],m=me();const sg=(l,v)=>`${l} ${v>0?'+':''}${typeof v==='number'?Math.round(v*10)/10:v}`;
 const M=S._mult??1,dim=(v,cur)=>v>0?v*M*clamp((100-cur)/45,0.15,1.2):v*clamp(cur/50,0.4,1.2);
 if(o.a){const v=dim(o.a,S.approval);S.approval+=v;out.push(sg('支持度',v));}
 if(o.s){const v=dim(o.s,S.stability);S.stability+=v;out.push(sg('穩定度',v));}
 if(o.p){const v=dim(o.p,S.prestige);S.prestige+=v;out.push(sg('國際聲望',v));}
 if(o.el&&!isDem(m)){S.elite+=o.el;out.push(sg('權力核心',o.el));}
 if(o.e)S.energy+=o.e;
 if(o.t){const v=money(o.t);S.treasury+=v;out.push(`國庫 ${v>=0?'+':''}${fmtB(v)}`);}
 if(o.mil){m.mil+=o.mil;m.mil0+=o.mil;out.push(sg('軍力',o.mil));}
 if(o.g){S.mods.push({g:o.g,days:o.gd||30,delay:o.delay||0});out.push(`經濟成長 ${o.g>0?'↑':'↓'}${o.delay?'（'+o.delay+'天後）':''}`);}
 if(o.am)S.mods.push({a:o.am,days:o.ad||20,delay:0});
 if(o.sm)S.mods.push({s:o.sm,days:o.sd||20,delay:0});
 if(o.rel)for(const [id,v] of o.rel){addRel(S.me,id,v);out.push(`與${C(id).name}關係 ${v>0?'+':''}${v}`);}
 clampAll();return out.length?'（'+out.join('、')+'）':'';}
function clampAll(){S.approval=clamp(S.approval,0,100);S.stability=clamp(S.stability,0,100);S.prestige=clamp(S.prestige,0,100);S.elite=clamp(S.elite,0,100);S.energy=clamp(S.energy,0,100);IDS.forEach(i=>{const c=C(i);c.mil=clamp(c.mil,3,150);c.growth=clamp(c.growth,-12,14);});}

function repMult(id){S.recent=(S.recent||[]).filter(r=>S.day-r[1]<5);const n=S.recent.filter(r=>r[0]===id).length;return Math.pow(0.6,n);}
function doAction(a){const r=avail(a);if(r)return {err:r};
 let gaffe='';if(a.e>0&&S.energy<20&&Math.random()<0.35){gaffe=' 😵 但你因過度疲勞在公開場合失言了！'+apply({a:-3});}
 S.energy-=a.e;S._fail=0;S._mult=repMult(a.id);const txt=a.run();S._mult=1;clampAll();S.recent.push([a.id,S.day]);const res=txt+gaffe;
 S.slots.push({id:a.id,n:nm(a),res});news('me','【'+nm(a)+'】'+res);return {res,fail:S._fail};}

// ================= 戰爭 =================
function sidePow(ids){return ids.reduce((s,id)=>s+C(id).mil*(0.75+Math.random()*0.5),0);}
function startWar(att,def){const A=[att],D=[def];let call=null;
 for(const o of IDS){if(o===att||o===def||inWar(o))continue;
  if(o===S.me){if(allied(o,def))call={ally:def,enemy:att};else if(allied(o,att))call={ally:att,enemy:def};continue;}
  if(allied(o,def)&&rel(o,att)<30&&Math.random()<0.65)D.push(o);else if(allied(o,att)&&rel(o,def)<0&&Math.random()<0.3)A.push(o);}
 const w={id:++S.wid,A,D,score:0,start:S.day,aggr:att};S.wars.push(w);
 S.base[key(att,def)]=Math.min(S.base[key(att,def)],-60);addRel(att,def,-40);
 for(const o of IDS)if(o!==att&&!A.includes(o))addRel(o,att,-6);
 news('war',`⚔️ ${C(att).name}對${C(def).name}宣戰！${D.length>1?D.slice(1).map(i=>C(i).name).join('、')+'依盟約參戰。':''}${A.length>1?A.slice(1).map(i=>C(i).name).join('、')+'加入攻方。':''}`);
 if(call)S.queue.push({id:'allyCall',p:{w:w.id,...call}});
 if(def===S.me)S.queue.push({id:'warDeclared',p:{t:att}});
 if(A.includes(S.me)||D.includes(S.me))S.lastWar=S.day;return w;}
function simWars(){for(const w of [...S.wars]){const pa=sidePow(w.A),pd=sidePow(w.D);const d=(pa-pd)/(pa+pd)*14+rnd(-4,4)-1.2;w.score=clamp(w.score+d,-100,100);
  [...w.A,...w.D].forEach(id=>C(id).mil=Math.max(5,C(id).mil-0.15));
  const inv=w.A.includes(S.me)||w.D.includes(S.me);if(inv)S.lastWar=S.day;
  if(w.score>=100)endWar(w,'A');else if(w.score<=-100)endWar(w,'D');else if(!inv&&S.day-w.start>15&&Math.random()<0.04)endWar(w,'peace');}}
function endWar(w,res){S.wars=S.wars.filter(x=>x!==w);const a=C(w.A[0]),d=C(w.D[0]);const my=w.A.includes(S.me)?'A':w.D.includes(S.me)?'D':null;let txt;
 if(res==='peace'){txt=`🕊️ ${a.name}與${d.name}簽署停火協議，戰爭結束。`;}
 else{const win=res==='A'?w.A:w.D,lose=res==='A'?w.D:w.A,L=C(lose[0]),cap=!!L.nuke;
  txt=cap?`${C(win[0]).name}陣營取得壓倒性優勢，但${L.name}擁有核武嚇阻，雙方在國際調停下停火。`:`🏳️ ${C(win[0]).name}陣營贏得戰爭，${L.name}被迫接受和約。`;
  lose.forEach(id=>{const c=C(id);c.growth-=1.5;if(id!==S.me)S.gen[id]=(S.gen[id]||0)+(Math.random()<.5?1:0);});
  if(my){if(my===res){S.stats.warsWon++;txt+=apply({a:cap?5:10,p:w.aggr===S.me?-2:5,t:cap?0:L.gdp/me().gdp*1.0});}
   else{S.stats.warsLost++;me().gdp*=cap?0.99:0.96;txt+=apply({a:cap?-8:-18,s:cap?-6:-15,p:-6});}}}
 news('war',txt);if(my)S.queue.push({id:'warEnd',p:{txt}});}
function proposePeace(t){const w=atWar(S.me,t);const my=w.A.includes(S.me)?w.score:-w.score;const days=S.day-w.start;let p=0.12+Math.max(0,my)/140+(days>20?0.15:0)+(days>40?0.15:0);if(my<-40)p*=0.3;
 if(Math.random()<p){endWar(w,'peace');S.queue=S.queue.filter(q=>q.id!=='warEnd');return `${C(t).name}接受停火！`+apply({a:my>=0?4:-2,p:2});}S._fail=1;return `${C(t).name}拒絕了停火提議。`+apply({a:-1});}
function concede(t){const w=atWar(S.me,t);S.wars=S.wars.filter(x=>x!==w);S.stats.warsLost++;news('war',`🏳️ ${me().name}向${C(t).name}讓步求和，戰爭結束。`);return '你簽下了屈辱的停戰協議。'+apply({a:-12,s:-6,t:-1.2,p:-4});}

// ================= 每日模擬 =================
function simulate(){const m=me();let gM=0,aM=0,sM=0;
 S.mods.forEach(x=>{if(x.delay>0){x.delay--;return;}gM+=x.g||0;aM+=x.a||0;sM+=x.s||0;x.days--;});S.mods=S.mods.filter(x=>x.days>0);
 for(const c of Object.values(S.c)){let tg=c.baseGrowth+tradeBon(c.id)-sanctionPen(c.id);if(inWar(c.id))tg-=1.5;
  if(c.id===S.me){const dr=S.treasury/c.gdp;if(dr<-0.08)tg-=Math.min(2.5,(-dr-0.08)*12);tg+=1.4*Math.tanh(gM/1.4)+(20-S.tax)*0.06+(S.spend-21)*0.05+(S.stability-60)*0.012;c.growth+=(tg-c.growth)*0.15+randn()*0.08;}
  else c.growth+=(tg-c.growth)*0.12+randn()*0.12;

function pressGame(a){const qs=PRESSQ.filter(q=>!q.cond||q.cond()).sort(()=>Math.random()-.5).slice(0,2);const rep=genLook('rep'+Math.random(),me().reg);let i=0,tot=0;
 const ask=()=>{const q=qs[i];modal(`<div class="ev"><div class="evscene">${sceneSVG('press',{})}</div><div class="evbody"><div class="spk" style="${persStyle('rp'+i)}">${portraitSVG(rep,'talking',{bg:'#1b2742'})}<b>記者提問 ${i+1}/2</b></div><div><p class="evtxt" id="qtxt"></p><div class="chs" id="chs" style="visibility:hidden">${Object.entries(ANS).map(([k,v])=>`<button class="ch" onclick="pressAns('${k}')">${v}</button>`).join('')}</div></div></div></div>`);typeText($('#qtxt'),'「'+q.q()+'」',()=>$('#chs').style.visibility='visible');};
 window.pressAns=k=>{const v=qs[i].s[k]+rnd(-.6,.6);tot+=v;sfx(v>0.5?'good':v<-0.5?'bad':'click');const react=v>1.2?'👏 記者們頻頻點頭，現場氣氛很好。':v>0?'🙂 回答還算得體。':v>-1?'😐 記者似乎不太滿意。':'😱 回答引發現場一陣譁然！';
  $('#chs').innerHTML=`<p class="react">${react}</p><button class="ch pri" onclick="pressNext()">${i<qs.length-1?'下一題 →':'結束記者會'}</button>`;};
 window.pressNext=()=>{i++;if(i<qs.length)return ask();const a2=Math.round(tot);if(tot>=3.5)S.stats.pressAce++;S._mult=repMult(a.id);finishMini(a,(a2>=2?'記者會大獲好評！':a2>=0?'記者會平穩落幕。':'記者會表現失常，引發負面報導。')+apply({a:clamp(a2,-5,5)}));};ask();}
function addressGame(a){modal(`<div class="ev"><div class="evscene">${sceneSVG('office',{talk:1,banner:'全國電視演說'})}</div><div class="evbody"><div class="spk" style="${persStyle('ad')}">${portraitSVG(S.cab[4].look,'talking',{bg:'#1b2742'})}<b>${S.cab[4].name}</b><small>${S.cab[4].t}</small></div><div><p class="evtxt">今晚的全國演說要主打什麼主題？選對民眾最關心的議題，效果會加倍。</p><div class="chs">${ADDRESS.map((x,i)=>`<button class="ch" onclick="doAddr(${i})">${x.t}</button>`).join('')}</div></div></div></div>`);
 window.doAddr=i=>{const x=ADDRESS[i];let fit=false;S._mult=repMult(a.id);try{fit=x.fit();}catch(e){}finishMini(a,fit?'演說切中民心，引發廣大迴響！'+apply({a:ri(3,5),s:2}):'演說中規中矩。'+apply({a:1}));};}
function advice(i){const c=S.cab[i],m=me();sfx('click');let t='';
 if(c.r==='chief')t=S.energy<30?'您的體力快見底了，建議安排休息，不然容易失言。':S.approval<40?'支持度偏低，建議多做地方視察、全國演說，或推出社福政策。':S.stability<45?'社會不太穩定，建議召開內閣會議並避免爭議政策。':'目前大致穩定。善用三個時段，內政、外交輪流顧。';
 if(c.r==='fin')t=S.treasury<0?`國庫已經赤字 ${fmtB(S.treasury)}，建議刪減支出或小幅加稅。`:m.growth<m.baseGrowth?'經濟低於潛在成長，可以考慮基礎建設、投資科技或簽貿易協定。':'經濟表現不錯，可以趁勢投資教育科技，打好長期底子。';
 if(c.r==='fm'){const best=others().filter(i=>!trading(S.me,i)&&rel(S.me,i)>=25&&!sanctioning(i,S.me)).sort((a,b)=>C(b).gdp-C(a).gdp)[0];const al=others().filter(i=>!allied(S.me,i)&&rel(S.me,i)>=60)[0];t=al?`我們與${C(al).name}關係很好，可以考慮提議結盟。`:best?`建議與${C(best).name}洽簽貿易協定，對經濟幫助很大。`:'可以多做電話會談和國事訪問，先把關係拉高到 25 以上再談貿易。';}
 if(c.r==='def'){const r=rivals(1)[0];const mw=myWars();t=mw.length?'前線吃緊！可以擴充軍備，或是在戰況有利時提議停火。':rel(S.me,r)<-60?`${C(r).name}的威脅正在升高（關係 ${Math.round(rel(S.me,r))}），建議加強戰備或透過外交降溫。`:'目前沒有立即的軍事威脅。';}
 if(c.r==='camp')t=isDem(m)?(camp()===''?`選戰已經開打！目前民調約 ${poll().toFixed(1)}%，造勢、辯論、拜票都要做。`:m.limit&&S.termNo>=m.limit?'這是您最後一個任期，專心留下政績吧！':`距離大選還有 ${S.nextElection-S.day} 天，先把支持度顧好，最後 15 天再全力衝刺。`):`權力核心支持度 ${S.elite.toFixed(0)}，下次權力會議前要維持在 30 以上。宣傳攻勢可以拉抬民意。`;
 modal(`<div class="adv"><div class="spk" style="${persStyle(c.name)}">${portraitSVG(c.look,'talking',{bg:'#1b2742'})}</div><div><b>${c.t} ${c.name}</b><p class="evtxt" id="advt"></p><button class="ch pri" onclick="closeModal()">了解</button></div></div>`);typeText($('#advt'),'「'+t+'」');}

// ---------- 事件 ----------
function showQueue(){if(S.over)return showOver();if(!S.queue.length){return;}const q=S.queue[0],ev=evDef(q.id);if(!ev){S.queue.shift();return showQueue();}const p=q.p||{};
 const adv=S.cab.find(c=>c.r===ev.adv)||S.cab[0];let txt='';try{txt=ev.text(p);}catch(e){console.error(e);S.queue.shift();return showQueue();}
 const ch=ev.ch(p);if(q.id==='warDeclared')sfx('war');else sfx('click');
 modal(`<div class="ev"><div class="evscene">${sceneSVG(ev.sc||'office',{...(ev.scd||{}),...p})}</div><div class="evbody"><div class="spk" style="${persStyle(adv.name)}">${portraitSVG(adv.look,'talking',{bg:'#1b2742'})}<b>${adv.name}</b><small>${adv.t}</small></div><div><h3>${ev.title}</h3><p class="evtxt" id="evt"></p><div class="chs" id="chs" style="visibility:hidden">${ch.map((c,i)=>`<button class="ch" onclick="pickCh(${i})"><b>${c.t}</b>${c.h?`<small>${c.h}</small>`:''}</button>`).join('')}</div></div></div></div>`,'evm');
 typeText($('#evt'),txt,()=>{const e=$('#chs');if(e)e.style.visibility='visible';});
 window.pickCh=i=>{const res=ch[i].f()||'';S.queue.shift();news('me',`【${ev.title}】${ch[i].t}。${res}`);achToasts();render();
  if(S.over){return showOver();}
  if(q.id==='electionNight'){const w=S.queue[0];return showQueue();}
  if(res){$('#chs').innerHTML=`<p class="react">${res}</p><button class="ch pri" onclick="nextQ()">繼續</button>`;sfx(/−|-\d/.test(res)&&!/\+/.test(res)?'bad':'good');}else nextQ();};}
function nextQ(){closeModal();render();if(S.queue.length)showQueue();save();}

// ---------- 一天結束 ----------
function endDay(){if(BUSY||S.over)return;BUSY=true;sfx('day');playScene(S.slots.some(s=>s.id==='rest')?'rest':'office',{t:3},'夜深了……');
 setTimeout(()=>{simulate();S.day++;S.slots=[];checks();if(!S.over&&!S.queue.length&&Math.random()<0.6)rollEvent();achToasts();save();
  const ov=$('#dayov');ov.innerHTML=`<div><small>${dateStr()}</small><b>執政第 ${S.day} 天</b></div>`;ov.className='show';setTimeout(()=>ov.className='',1300);
  BUSY=false;render();playScene('office',{t:0},'早安！晨間簡報已送到桌上。');$('#result').innerHTML='';setTimeout(showQueue,1000);},700);}

// ---------- 其他視窗 ----------
function showOver(){const L=legacy(),m=me(),[t,d]=OVER[S.over.reason]||['遊戲結束',''];sfx(S.over.reason==='termEnd'?'win':'bad');
 const sc=S.over.reason==='election'?sceneSVG('election',{share:S.elecShare||45}):sceneSVG(S.over.reason==='termEnd'?'rally':'protest',{banner:t.replace(/^\S+\s/,'')});
 modal(`<div class="over"><div class="evscene">${sc}</div><h2>${t}</h2><p>${d}${S.over.reason==='election'?`（得票率 ${(S.elecShare||0).toFixed(1)}%）`:''}</p>
 <div class="grade"><b>${L.g[0]}</b><span>歷史評價：${L.g[1]}</span></div>
 <div class="ogrid"><div>執政天數<b>${S.day}</b></div><div>任期<b>${S.termNo}</b></div><div>GDP 變化<b class="${L.gch>=0?'up':'dn'}">${L.gch>=0?'+':''}${L.gch.toFixed(1)}%</b></div><div>最終支持度<b>${S.approval.toFixed(1)}%</b></div><div>國事訪問<b>${S.stats.visits}</b></div><div>貿易協定<b>${S.stats.deals}</b></div><div>戰爭勝/敗<b>${S.stats.warsWon}/${S.stats.warsLost}</b></div><div>成就<b>${S.ach.length}/${ACH.length}</b></div></div>
 <div class="row c"><button class="big pri" onclick="S=null;showStart()">再玩一次</button></div></div>`,'full');}
function showCharts(){const H=S.hist;if(H.length<2){toast('再多玩幾天就有數據圖表了');return;}const ch=(idx,lab,col,unit)=>{const vs=H.map(r=>r[idx]);let mn=Math.min(...vs),mx=Math.max(...vs);if(mx-mn<1){mx+=.5;mn-=.5;}const W=560,Hh=120;const pts=vs.map((v,i)=>`${(i/(vs.length-1)*W).toFixed(1)},${(Hh-(v-mn)/(mx-mn)*Hh).toFixed(1)}`).join(' ');
  return `<div class="chart"><b>${lab}</b><svg viewBox="-40 -10 ${W+50} ${Hh+30}"><line x1="0" y1="0" x2="${W}" y2="0" stroke="#26324d"/><line x1="0" y1="${Hh}" x2="${W}" y2="${Hh}" stroke="#26324d"/><text x="-6" y="4" text-anchor="end">${mx.toFixed(1)}${unit}</text><text x="-6" y="${Hh+4}" text-anchor="end">${mn.toFixed(1)}${unit}</text><text x="0" y="${Hh+18}">D${H[0][0]}</text><text x="${W}" y="${Hh+18}" text-anchor="end">D${H[H.length-1][0]}</text><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.5"/></svg></div>`;};
 modal(`<h2>📊 施政數據</h2>${ch(1,'支持度','#f2b84b','%')}${ch(2,'經濟成長率','#3ecf8e','%')}${ch(3,'國庫（佔 GDP %）','#5aa9ff','%')}<div class="row r"><button class="pri" onclick="closeModal()">關閉</button></div>`);}
function showAch(){modal(`<h2>🏅 成就 ${S.ach.length}/${ACH.length}</h2><div class="achs">${ACH.map(([id,ic,t,d])=>`<div class="achi ${S.ach.includes(id)?'on':''}"><span>${ic}</span><b>${t}</b><small>${d}</small></div>`).join('')}</div><div class="row r"><button class="pri" onclick="closeModal()">關閉</button></div>`);}
function showHelp(){modal(`<h2>❓ 遊戲說明</h2><div class="help">
 <p><b>每天的流程：</b>早上看晨間簡報 → 處理突發事件 → 在上午、下午、晚上三個時段各安排一項行動 → 結束今天。</p>
 <p><b>體力：</b>每個行程都消耗體力，晚上會恢復。體力低於 20 時容易失言。</p>
 <p><b>選舉（民主國家）：</b>任期縮短計算（現實 1 年 ≈ 遊戲 30 天）。大選前 15 天開放「選戰」行動。得票率主要看支持度和選戰表現。有任期上限的國家，做滿就光榮卸任。</p>
 <p><b>威權／君主體制：</b>沒有選舉，但每 90 天的權力會議前，「權力核心」要維持在 30 以上；社會穩定度長期低於 15 會導致政權垮台。</p>
 <p><b>外交：</b>點地圖選目標。關係 ≥ 25 可簽貿易協定、≥ 60 可結盟；制裁會傷害對方經濟但可能遭報復。</p>
 <p><b>戰爭：</b>關係 ≤ −40 才能宣戰。戰力取決於軍力，盟友可能參戰；長期戰爭會拖垮經濟和支持度。對擁核國家無法徹底獲勝。</p>
 <p><b>地圖顏色：</b>綠色＝友好、紅色＝敵對、金色＝你的國家、紅斜紋＝與你交戰。藍色連線＝你的盟友，紅色虛線＝戰爭。</p>
 <p><b>小技巧：</b>點擊內閣幕僚可以聽建議；記者會和全國演說是小遊戲，答得好加分更多。</p>
 <p class="fine">所有人物皆為虛構，國家數據為約略值，遊戲機制為簡化模擬，不代表任何政治立場。</p></div><div class="row r"><button class="pri" onclick="closeModal()">開始吧</button></div>`);}
function toggleSound(){SOUND=!SOUND;try{localStorage.setItem('wl_snd',SOUND?'1':'0');}catch(e){}sfx('good');render();}
function menu(){modal(`<h2>☰ 選單</h2><div class="col"><button onclick="closeModal()">▶ 繼續遊戲</button><button onclick="if(confirmBox())0">🌅 宣布引退（結束這局）</button><button onclick="save();S=null;showStart()">💾 儲存並回到主畫面</button></div>`);}
function confirmBox(){modal(`<h2>確定要引退嗎？</h2><p>這局遊戲會結算並結束。</p><div class="row r"><button onclick="menu()">取消</button><button class="pri" onclick="gameOver('retire');showOver()">確定引退</button></div>`);return true;}
window.addEventListener('load',()=>{showStart();});

</script>
</body>
